# Monthly: write STATUS.md (what the bucket contains) and commit it.
# Besides documenting the data, the commit keeps the repository "active": GitHub disables
# scheduled workflows in public repositories after 60 days without activity.
name: Monthly status

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install .
      - name: Write STATUS.md
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: ${{ vars.HF_BUCKET }}
        run: weather-wh status --remote > STATUS.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git diff --cached --quiet || git commit -m "Update data warehouse status"
          git push
